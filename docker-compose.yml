services:
  db:
    image: postgres:16
    container_name: cinema_postgres
    env_file:
      - .env
    ports:
      - "${POSTGRES_DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: cinema_mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - cinema_net

volumes:
  postgres_data:

networks:
  cinema_net:
    driver: bridge
